      <path d="M480 198V28" marker-end="url(#axis-arrow)"/>
    </g>
    <path d="M480 172H549V103" fill="none" stroke="#4a5058" stroke-width="1.4" stroke-dasharray="6 5"/>
    <path d="M455 78 549 172H654" fill="none" stroke="#101214" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#101214" font-family="Arial, Helvetica, sans-serif" font-size="17">
      <text x="487" y="98">0</text>
      <text x="544" y="98">3</text>
      <text x="449" y="179">−3</text>
      <g font-style="italic">
