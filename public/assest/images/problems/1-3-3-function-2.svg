<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" role="img" aria-labelledby="title description">
  <title id="title">1.3.3-masala, 2-chizma: y = −x va y = −3</title>
  <desc id="description">x 3 dan kichik bo‘lsa y = −x, aks holda y = −3. (3; −3) burilish nuqtasining koordinatalari uzlukli chiziqlar bilan belgilangan.</desc>
