<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="title description">
  <title id="title">1.3.56-masala, 6-chizma</title>
  <desc id="description">y = 2 va y = 4 gorizontal chiziqlari hamda x = 1 vertikal chizig‘i bilan chegaralangan, o‘ng chegarasi egri shtrixlangan soha.</desc>
  <defs>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <path d="M0 0V7" stroke="#555" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0 0 8 3 0 6Z" fill="#17191b"/>
    </marker>
  </defs>
  <path d="M122 99H174C188 99 189 86 181 76 172 65 187 54 179 43 173 34 184 30 175 27H122Z" fill="url(#hatch)" stroke="#45484b" stroke-width="1.2"/>
  <g fill="none" stroke="#17191b" stroke-width="1.3">
    <path d="M35 174H326" marker-end="url(#arrow)"/>
    <path d="M66 198V18" marker-end="url(#arrow)"/>
  </g>
  <path d="M122 174V99M66 99H122M66 27H122" fill="none" stroke="#777" stroke-width="1.1" stroke-dasharray="5 4"/>
  <g fill="#17191b" font-family="Georgia,serif" font-size="15">
    <text x="116" y="192">1</text><text x="43" y="104">2</text><text x="43" y="32">4</text>
    <text x="314" y="169" font-style="italic">x</text><text x="72" y="25" font-style="italic">y</text>
    <text x="18" y="213" font-size="20">6)</text>
  </g>
</svg>